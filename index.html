<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Content Security Policy, delivered as a meta tag because GitHub Pages
      serves static files and cannot send headers. Every origin below is one
      the site actually needs:

        script-src 'self'   The bundle is the only script. Vite emits it as an
                            external module, so no 'unsafe-inline' is needed —
                            and that is the directive worth keeping strict,
                            since it is what makes an injected <script> inert.
                            The JSON-LD block further down is a data block, not
                            executable, so script-src does not apply to it.
        style-src           'unsafe-inline' is unavoidable: React writes
                            style={{ ... }} out as style attributes, which this
                            directive governs. Google Fonts serves the
                            stylesheet from fonts.googleapis.com.
        font-src            The font files themselves come from gstatic.
        img-src             Local assets, plus Supabase Storage for anything an
                            admin uploads through the panel. data: covers the
                            small assets Vite inlines.
        connect-src         PostgREST, Auth and the Edge Functions, all on the
                            project's *.supabase.co host. Wildcarded because
                            VITE_SUPABASE_URL is a build-time value and this
                            file is static.
        form-action 'self'  No form posts anywhere; every one is handled in JS
                            and submitted by fetch. Stripe is reached by
                            assigning window.location, which is a navigation
                            and deliberately not restricted here.
        object-src 'none'   No plugins, ever.

      Note what this cannot do: frame-ancestors, and therefore clickjacking
      protection, is ignored when CSP arrives in a meta tag — it needs a real
      header. The same goes for X-Frame-Options. Fixing that properly means
      moving off GitHub Pages to something that can set headers (Cloudflare
      Pages or Netlify both can), which is a hosting decision, not a code one.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co; form-action 'self'; upgrade-insecure-requests"
    />

    <!--
      Everything below, to the end of the head, is what a crawler sees. The
      %TOKENS% are filled in at build time by the pawtx-seo plugin in
      vite.config.ts, from src/lib/seo.ts — edit the values there, not here.

      Do not write a literal closing head tag anywhere in this comment: Vite
      injects the bundle before the first one it finds, which puts the whole
      application inside the comment and ships a blank page.

      This has to be static HTML: no link-preview crawler runs JavaScript, so
      the <Helmet> block in App.tsx never reaches Facebook, X, WhatsApp,
      LinkedIn, iMessage or Slack.

      Do not repeat any of these tags in that Helmet block. On React 19 the
      library hoists tags natively instead of taking over matching ones, so
      the page would carry two of each and the crawlers would pick whichever
      they saw first.

      Per-tab variants are pointless here anyway: navigation is a tab in a
      Zustand store rather than a route, so every tab shares this one URL and
      a shared link always opens the home page.
    -->
    <title>%SITE_TITLE%</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />
    <link rel="canonical" href="%CANONICAL_URL%" />
    <meta name="theme-color" content="%THEME_COLOR%" />

    <!-- Open Graph — Facebook, LinkedIn, WhatsApp, iMessage, Slack, Signal. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%SITE_NAME%" />
    <meta property="og:title" content="%SITE_TITLE%" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:url" content="%CANONICAL_URL%" />
    <meta property="og:image" content="%OG_IMAGE_URL%" />
    <!-- Stating the dimensions lets the card render on first share, before the
         crawler has fetched and measured the image. -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%OG_IMAGE_ALT%" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_US" />

    <!-- X falls back to the og: tags for title, description and image; these
         are the two that have no Open Graph equivalent. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="%X_HANDLE%" />

    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <script type="application/ld+json">%ORG_JSONLD%</script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Inter 300 is not requested: `font-light` is used nowhere in the app.
         Both Playfair italics are, in the hero and the mission section.
         Oswald is the wordmark only — a condensed gothic matching the lettering
         inside the shield logo it sits next to — so just the two weights that
         lockup uses, not the family. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <!-- Print portal target — see src/index.css for why printable content
         (a signed document, a certificate) is mounted here instead of inline
         inside #root. -->
    <div id="print-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
