name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent deployment; don't cancel an in-progress release
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          # Vite inlines these at build time, so they must be present here or
          # the published site ships with no backend at all. Both are public
          # values (the anon key is protected by RLS), but they still live in
          # repo secrets so the project can be re-pointed without a code change.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Not a secret — a build-time switch, kept here in plain sight rather
          # than in repo secrets so that what production was built with is
          # readable from the repository. Turning transactional email back off
          # is a one-line commit, which is also the audit trail for when it
          # happened. See src/lib/features.ts for what each flag gates.
          VITE_EMAIL_ENABLED: 'true'

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Let the workflow enable Pages itself (needs the pages: write permission above)
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
