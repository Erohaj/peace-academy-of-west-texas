name: Fetch Social Posts

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # To start deploy.yml once the feed is committed -- see the last step.
  actions: write

# A manual dispatch landing on top of a scheduled run would otherwise race it
# to push to main, and the loser fails on a non-fast-forward.
concurrency:
  group: fetch-social
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # sharp, which converts each post's image to WebP before it is committed.
      # Meta's own image URLs expire, so the feed serves copies from
      # public/social-media/ instead.
      - name: Install dependencies
        run: npm ci

      - name: Fetch latest Facebook & Instagram posts
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node scripts/fetch-social-posts.mjs

      # Runs even when the fetch step failed. The script exits non-zero when one
      # platform's fetch fails -- that is what turns a revoked token into an
      # email -- but it has still written the other platform's fresh posts and
      # kept the failed one's previous posts, and that file is worth publishing.
      - name: Commit updated feed
        id: commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A public/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: refresh social feed"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The push above does not deploy anything by itself. GitHub does not start
      # workflows for events caused by this job's own GITHUB_TOKEN -- a guard
      # against workflows triggering each other in a loop -- so deploy.yml's
      # `on: push` never fires for these commits. The first real fetch, on
      # 2026-10-17, committed ten Instagram posts to main and the live site went
      # on showing "not connected yet". workflow_dispatch is the documented
      # exception to that rule, so the deploy is started explicitly.
      - name: Deploy the refreshed feed
        if: ${{ !cancelled() && steps.commit.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
